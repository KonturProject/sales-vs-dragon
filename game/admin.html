<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src-admin/styles.css">
    <title>Админка — план продаж</title>
</head>
<body>
    <div class="scene-glow"></div>
    <div class="admin-card">
        <div class="eyebrow">Свин и загон</div>
        <h1>Недельный план продаж</h1>

        <p id="current-status" class="current-status" hidden></p>

        <form id="pin-form">
            <label for="pin">PIN-код</label>
            <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" required />
            <button type="submit">Войти<span class="btn-arrow">→</span></button>
        </form>

        <form id="plan-form" hidden>
            <label for="plan">Новый план, ₽</label>
            <input id="plan" name="plan" type="number" min="0" step="1000" placeholder="5000000" required />
            <button type="submit">Сохранить<span class="btn-arrow">→</span></button>
        </form>

        <p id="status" role="status"></p>
    </div>

    <script type="module" src="/src-admin/main.ts"></script>
</body>
</html>
